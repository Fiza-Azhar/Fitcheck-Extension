<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitCheck</title>
    <style>
      :root {
        --bg: #f7f1e8; --surface: #fffdf9; --text: #2e2a26; --muted: #8a8178;
        --border: #e7ddcd; --accent: #c56b4a; --success: #4f8a5b; --warn: #c98a2e;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px; margin: 0; padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--text);
      }
      h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: -0.3px; }
      .tagline { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
      label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
      input {
        width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid var(--border);
        border-radius: 10px; background: var(--surface); color: var(--text);
      }
      button {
        width: 100%; padding: 10px; margin-top: 12px; font-size: 14px; font-weight: 700;
        border: 0; border-radius: 10px; cursor: pointer; background: var(--text); color: #fff;
      }
      button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
      button:disabled { opacity: 0.5; cursor: default; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
      .who { font-size: 14px; font-weight: 700; }
      .count { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .msg { font-size: 12px; margin-top: 10px; min-height: 15px; }
      .msg.err { color: var(--warn); }
      .msg.ok { color: var(--success); }
      hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
      .settings-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>FitCheck</h1>
    <p class="tagline">Wardrobe-aware suggestions while you shop.</p>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
